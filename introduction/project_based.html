<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <!-- ✅ Add Tailwind CDN here -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
 <body>
   <!-- ✅ Navbar -->
<div class="bg-green-800 text-white p-4">
  <div class="max-w-7xl mx-auto flex justify-between items-center">
    <!-- Logo -->
    <div class="text-xl font-bold">My Website</div>

    <!-- Menu -->
    <div class="hidden md:flex space-x-6">
      <div><a href="#" class="hover:text-gray-300">Home</a></div>
      <div><a href="#" class="hover:text-gray-300">About</a></div>
      <div><a href="#" class="hover:text-gray-300">Contact</a></div>
    </div>

    <!-- Mobile menu button -->
    <div class="md:hidden px-3 py-2 border rounded text-gray-200 border-gray-400 hover:bg-gray-700 cursor-pointer">
      ☰
    </div>
  </div>
</div>

<!-- ✅ Hero Section -->
<div class="max-w-sm md:max-w-2xl mx-auto bg-black shadow-2xl rounded-3xl p-8 mt-8 text-white text-center">
  <div class="text-2xl md:text-3xl font-semibold">Welcome to Tailwind CSS</div>
  <div class="text-gray-400 mt-4">
    This is a beginner-level project to learn the basics of TailwindCSS.
  </div>
  <div class="mt-6">
    <button class="bg-blue-500 text-white px-6 py-2 rounded hover:bg-pink-600 transition">
      Learn More
    </button>
  </div>
</div>

<div class="flex justify-between items-center bg-green-100 p-4 h-48">
  <div class="bg-blue-500 text-white p-4">Item 1</div>
  <div class="bg-blue-400 text-white p-4">Item 2</div>
  <div class="bg-blue-300 text-white p-4">Item 3</div>
  <div class="bg-blue-300 text-white p-4">Item 4</div>
</div>


  <form class="max-w-lg mx-auto bg-gray-300 shadow-lg rounded p-6 mt-8">
    <div>
      <label for="name" class="block text-gray-700">Name</label>
      <input id="name" type="text" 
             class="w-full mt-2 p-2 border rounded focus:outline-none focus:ring-2 focus:ring-green-500">
    </div>

    <div class="mt-4">
      <label for="email" class="block text-gray-700">Email</label>
      <input id="email" type="email" 
             class="w-full mt-2 p-2 border rounded focus:outline-none focus:ring-2 focus:ring-green-500">
    </div>

    <button class="mt-6 bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
      Submit
    </button>
  </form>


  

</body>
</html>
